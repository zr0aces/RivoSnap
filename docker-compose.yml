name: rivosnap

x-service: &service
  restart: unless-stopped
  init: true
  environment:
    DATABASE_URL: "${DATABASE_URL:-}"
    REDIS_URL: "${REDIS_URL:-}"
    APP_URL: "${APP_URL:-}"
    SESSION_SECRET: "${SESSION_SECRET:-}"
    TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY:-}"
    BOOTSTRAP_SECRET: "${BOOTSTRAP_SECRET:-}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
    LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN:-}"
    LINE_CHANNEL_SECRET: "${LINE_CHANNEL_SECRET:-}"
    NODE_ENV: ${NODE_ENV:-production}
    TZ: Asia/Bangkok
    MIN_FREE_MB: ${MIN_FREE_MB:-1024}
    MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-50}
    MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-200}
    STAGING_PATH: /data/staging
    THUMBNAIL_PATH: /data/thumbnails
    STAGING_RETENTION_HOURS: ${STAGING_RETENTION_HOURS:-24}
    FAILED_RETENTION_DAYS: ${FAILED_RETENTION_DAYS:-7}
    THUMBNAIL_RETENTION_DAYS: ${THUMBNAIL_RETENTION_DAYS:-30}
  networks: [private, outbound]
  volumes: [staging:/data/staging, thumbnails:/data/thumbnails]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m

services:
  postgres:
    image: postgres:18.7
    container_name: rivosnap-postgres
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gallery
      POSTGRES_DB: gallery
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      TZ: Asia/Bangkok
    volumes: [postgres:/var/lib/postgresql]
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, gallery]
      interval: 5s
      timeout: 4s
      retries: 15

  redis:
    image: redis:7.4.12-alpine
    container_name: rivosnap-redis
    user: redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 4s
      retries: 10

  api:
    <<: *service
    build: {context: ., dockerfile: Dockerfile.api}
    container_name: rivosnap-api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/rivosnap, healthcheck-api]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  worker:
    <<: *service
    build: {context: ., dockerfile: Dockerfile.worker}
    container_name: rivosnap-worker
    depends_on: &api_ready
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/rivosnap, healthcheck-worker]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 110s

  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    container_name: rivosnap-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./infra/docker/web.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [outbound]
    restart: unless-stopped
    depends_on: *api_ready
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/v1/auth/status"]
      interval: 15s
      timeout: 4s
      retries: 3

  caddy:
    build: {context: ., dockerfile: infra/caddy/Dockerfile}
    container_name: rivosnap-caddy
    profiles: [edge]
    environment: {APP_URL: "${APP_URL}"}
    ports: ["80:80","443:443"]
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    networks: [outbound]
    volumes: [caddy_data:/data,caddy_config:/config]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 4s
      retries: 3

networks:
  private: {internal: true}
  outbound: {}

volumes:
  postgres: {}
  redis: {}
  thumbnails: {}
  staging: {}
  caddy_data: {}
  caddy_config: {}
